name: 📊 GitHub Stats

on:
  # 每天 UTC 0 点自动跑（北京时间 8 点）
  schedule:
    - cron: "0 0 * * *"
  # 手动触发
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate stats / streak / languages SVGs
        uses: jstrieb/github-stats@v2
        with:
          username: Dest1ny-Sec
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to stats branch
        run: |
          cd stats
          git init -q
          git checkout -q --orphan stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: stats update 📊"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Dest1ny-Sec/Dest1ny-Sec.git" HEAD:stats
