name: 🐍 Generate Snake

on:
  # 每周自动跑一次（cron UTC，周日午夜）
  schedule:
    - cron: "0 0 * * 0"
  # 手动触发
  workflow_dispatch:
  # push 到 main 也跑（让你刚改完代码就能看到贪吃蛇）
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake game
        uses: Platane/snk@v3
        with:
          github_user_name: Dest1ny-Sec
          svg_path: dist/github-snake.svg
          gif_path: dist/github-snake.gif
          # 调色板：用银河紫 + Heisenberg 蓝绿
          palette: github-dark

      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "chore: 🐍 feed the snake"
          full_commit_message: "auto-generated snake animation"
