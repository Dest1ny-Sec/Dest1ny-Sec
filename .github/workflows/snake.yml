name: 🐍 Generate Snake

on:
  # 每周日 UTC 午夜
  schedule:
    - cron: "0 0 * * 0"
  # 手动触发
  workflow_dispatch:
  # push 到 main 也跑
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: Dest1ny-Sec
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00D4AA&color_dots=#0d1117,#3A0CA3,#7B2CBF,#FF006E,#FFC107
            dist/github-snake.svg?palette=github&color_snake=#7B2CBF&color_dots=#0d1117,#3A0CA3,#7B2CBF,#FF006E,#FFC107
            dist/github-snake.gif?palette=github-dark&color_snake=#00D4AA

      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "chore: 🐍 feed the snake"
          full_commit_message: "auto-generated snake animation"
